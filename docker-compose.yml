services:
  postgres:
    image: postgres:16-alpine
    container_name: houndfe-chatbot-postgres
    environment:
      POSTGRES_USER: houndfe
      POSTGRES_PASSWORD: houndfe
      POSTGRES_DB: houndfe_chatbot
    ports:
      - '5432:5432'
    volumes:
      - houndfe-chatbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U houndfe -d houndfe_chatbot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  houndfe-chatbot-postgres-data: